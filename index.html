<html lang="en">

    <meta charset="UTF-8" />

    <title>KRUM - Precision Ticket & Attendance Workspace</title>
    <meta name="description" content="KRUM - A high-performance personal & team workspace for project boards, AI notes, attendance, and analytics." />
    <meta property="og:title" content="KRUM - Precision Ticket & Attendance Workspace" />
    <meta property="og:description" content="KRUM - A high-performance personal & team workspace for project boards, AI notes, attendance, and analytics." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // Immediate dark mode hydration to prevent white flash
      (function() {
        try {
          var saved = localStorage.getItem('krum_theme_preference');
          var cursorSaved = localStorage.getItem('krum_custom_cursor_preference');
          var isDark = saved === 'dark' || (!saved && true) || (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
          if (cursorSaved !== 'false') {
            document.documentElement.classList.add('krum-custom-cursor-active');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
